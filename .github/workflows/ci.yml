name: CI Build Check

on:
  push:
    branches: [ main, Long, '**' ]
  pull_request:
    branches: [ main, Long ]

jobs:
  check-frontend:
    name: Check Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend & Typecheck
        run: npm run build

  check-backend:
    name: Check Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore & Build .NET Backend
        run: dotnet build backend/WebCafe.Backend.csproj
